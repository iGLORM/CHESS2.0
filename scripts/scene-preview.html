<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scene Preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0912; overflow: hidden; font: 13px/1.4 system-ui, sans-serif; color: #c8c0e0; }
  canvas { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; }
  #hud { position: absolute; left: 8px; bottom: 6px; opacity: 0.7; }
</style>
</head>
<body>
<!-- Live pixel scene preview. Serve the project root (the scene files are loaded from ../src):
       python3 -m http.server 8791   then   http://localhost:8791/scripts/scene-preview.html?scene=pawnhollow
     Options: ?t=20 freezes at a time; keys: space pause, arrows step one frame (shift: 1 s). -->
<canvas id="c"></canvas>
<div id="hud"></div>
<script src="../src/themes/LiveScenes.js"></script>
<script src="../src/themes/scenes/PixelKit.js"></script>
<script>
const params = new URLSearchParams(location.search);
const id = params.get('scene') || 'pawnhollow';
const script = document.createElement('script');
script.src = `../src/themes/scenes/${id}.js`;
script.onerror = () => { document.getElementById('hud').textContent = `No scene file src/themes/scenes/${id}.js`; };
script.onload = start;
document.head.appendChild(script);

function start() {
  const def = LiveScenes.get(id);
  if (!def) { document.getElementById('hud').textContent = `${id}.js did not register '${id}'`; return; }
  const cv = document.getElementById('c'), ctx = cv.getContext('2d');
  cv.width = def.width; cv.height = def.height;
  const buf = new Uint32Array(def.width * def.height);
  const img = new ImageData(new Uint8ClampedArray(buf.buffer), def.width, def.height);
  const draw = def.create();
  const fit = () => {
    const s = Math.min(innerWidth / def.width, innerHeight / def.height);
    cv.style.width = def.width * s + 'px'; cv.style.height = def.height * s + 'px';
  };
  addEventListener('resize', fit); fit();

  let t = params.has('t') ? parseFloat(params.get('t')) : 0, paused = params.has('t'), last = performance.now(), ms = 0;
  const hud = document.getElementById('hud');
  addEventListener('keydown', e => {
    if (e.key === ' ') paused = !paused;
    if (e.key === 'ArrowRight') { paused = true; t += e.shiftKey ? 1 : 1 / def.fps; }
    if (e.key === 'ArrowLeft') { paused = true; t -= e.shiftKey ? 1 : 1 / def.fps; }
  });
  (function frame(now) {
    if (!paused) t += (now - last) / 1000;
    last = now;
    t = ((t % def.loop) + def.loop) % def.loop;
    const a = performance.now();
    draw(Math.floor(t * def.fps) / def.fps, buf);
    ms = ms * 0.9 + (performance.now() - a) * 0.1;
    ctx.putImageData(img, 0, 0);
    hud.textContent = `${id}  t=${t.toFixed(2)}s / ${def.loop}s  ${ms.toFixed(2)} ms/frame${paused ? '  (paused)' : ''}`;
    requestAnimationFrame(frame);
  })(last);
}
</script>
</body>
</html>
